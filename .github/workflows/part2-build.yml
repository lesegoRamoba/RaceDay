name: .NET Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
        
    - name: Restore dependencies (API)
      run: dotnet restore Part2/RaceDay.API/RaceDay.API.csproj
      
    - name: Build API
      run: dotnet build Part2/RaceDay.API/RaceDay.API.csproj --no-restore
      
    - name: Restore dependencies (MVC)
      run: dotnet restore Part2/RaceDay.MVC/RaceDay.MVC.csproj
      
    - name: Build MVC
      run: dotnet build Part2/RaceDay.MVC/RaceDay.MVC.csproj --no-restore
