
name: RaceDay Part 2 API Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Part2/RaceDay.API/RaceDay.sln

      - name: Build RaceDay API
        run: dotnet build Part2/RaceDay.API/RaceDay.sln --configuration Release --no-restore
